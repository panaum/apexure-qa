# Railway Nixpacks configuration
# Installs system dependencies required by Playwright's Chromium on Linux

[phases.setup]
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libx11-6",
  "libxext6",
  "libxcb1"
]

[phases.install]
# --include=dev forces devDeps to install even when NODE_ENV=production is set by Railway
cmds = ["npm install --include=dev"]

[phases.build]
# Build the Vite frontend (requires vite from devDeps above)
cmds = ["npm run build", "npx playwright install chromium"]

[start]
cmd = "npm run start"

