<!DOCTYPE html>
<html>

<body>
    <script>
        const LIVE_URL = "https://apexure-qa-guit.onrender.com";

        // Wake up Render as soon as the plugin opens
        async function wakeUpServer() {
            console.log("[Plugin] Waking up Render server...");
            try {
                await fetch(`${LIVE_URL}/api/figma-data`, { method: 'GET' });
                console.log("[Plugin] Server is awake!");
            } catch (e) {
                console.warn("[Plugin] Wake up ping failed, but we will try anyway.");
            }
        }
        wakeUpServer();

        async function liveFetch(path, options) {
            console.log(`[Plugin] Connecting to Live Render: ${LIVE_URL}/api${path}`);
            return fetch(`${LIVE_URL}/api${path}`, {
                ...options,
                // Give it up to 10 seconds to respond in case it's waking up
                signal: AbortSignal.timeout(10000) 
            });
        }

        window.addEventListener('message', async (event) => {
            const msg = event.data.pluginMessage;
            if (!msg) return;

            if (msg.type === 'send-data') {
                try {
                    const response = await liveFetch('/figma-data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(msg.payload)
                    });

                    if (response.ok) {
                        parent.postMessage({ pluginMessage: { type: 'success' } }, '*');
                    } else {
                        throw new Error(`Server responded with ${response.status}`);
                    }
                } catch (e) {
                    console.error('[Plugin Error] figma-data failed:', e);
                    parent.postMessage({ pluginMessage: { type: 'error', message: e.message } }, '*');
                }
            }

            if (msg.type === 'export-frame') {
                try {
                    const { frameBase64, frameName, width, height, nodes } = msg.payload;
                    const response = await liveFetch('/figma-frame', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ frameBase64, frameName, width, height, nodes })
                    });

                    if (response.ok) {
                        parent.postMessage({ pluginMessage: { type: 'export-success' } }, '*');
                    } else {
                        throw new Error(`Server responded with ${response.status}`);
                    }
                } catch (e) {
                    console.error('[Plugin Error] figma-frame failed:', e);
                    parent.postMessage({ pluginMessage: { type: 'export-error', message: e.message } }, '*');
                }
            }
        });
    </script>
</body>

</html>
